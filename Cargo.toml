[package]
name = "dernged"
version = "0.2.0"
edition = "2024"
description = "Deterministic random number generator"
authors = ["Beltram Maldant"]
keywords = ["random", "rng"]
license = "Apache-2.0"

include = ["/src/*", "/Cargo.toml"]

[dependencies]
rand_core = { version = "0.10", default-features = false }

[dev-dependencies]
insta = { version = "1", default-features = false }
hex = { version = "0.4", default-features = false, features = ["alloc"] }
